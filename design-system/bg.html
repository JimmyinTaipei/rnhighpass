<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>多保命 背景素材</title>
<link rel="stylesheet" href="../social/social.css">
<style>
  .slide.t { background: none; } /* 透明圖層 */
  .slide.nocloud .cloud { display: none; }
  .slide.cloudonly .waves { display: none; }
</style></head><body>
<!-- 1 完整背景（漸層+青海波+祥雲） -->
<section class="slide cover"><div class="waves"></div></section>
<!-- 2 漸層+青海波（無祥雲） -->
<section class="slide nocloud"><div class="waves"></div></section>
<!-- 3 純漸層 -->
<section class="slide nocloud"></section>
<!-- 4 青海波（透明底） -->
<section class="slide t nocloud"><div class="waves"></div></section>
<!-- 5 祥雲（透明底，一般頁位置） -->
<section class="slide t cloudonly"></section>
<script src="../social/social.js"></script></body></html>
