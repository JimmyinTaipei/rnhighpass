<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多保命 RN High Pass｜護理國考分章題本</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 頁首 / 品牌 -->
  <header class="site-header">
    <div class="container">
      <h1 class="brand">多保命 <span class="brand-en">RN High Pass</span></h1>
    </div>
  </header>

  <!-- 主視覺 / 簡短介紹 -->
  <section class="hero">
    <div class="container">
      <p class="hero-text">
        護理國考分章題本，免費分享給學弟妹。
        希望能幫助大家更有效率地準備考試，順利上榜！
      </p>
    </div>
  </section>

  <!-- 下載題本 -->
  <section class="section" id="download">
    <div class="container">
      <h2>下載題本</h2>
      <p>各章節題本整理完成後會放在這裡，點擊下方按鈕即可下載。</p>
      <a href="#" class="btn">下載題本（雲端硬碟連結）</a>
    </div>
  </section>

  <!-- 使用說明 -->
  <section class="section" id="guide">
    <div class="container">
      <h2>使用說明</h2>
      <ul class="guide-list">
        <li>題本依章節分類，建議搭配課本或講義一起使用。</li>
        <li>下載後可自行列印或用平板 / 手機閱讀。</li>
        <li>如發現題目有誤或需要更新，歡迎透過社群留言告知。</li>
        <li>內容僅供學習交流使用，請勿作商業用途。</li>
      </ul>
    </div>
  </section>

  <!-- 工具區 -->
  <section class="section" id="tools">
    <div class="container">
      <h2>工具</h2>
      <p class="coming-soon">敬請期待 🚧</p>
      <!-- 之後這裡會放各種小工具卡片，例如點滴速率計算機，連結到 /tools/ 底下的頁面 -->
    </div>
  </section>

  <!-- 頁尾 / 社群連結 -->
  <footer class="site-footer">
    <div class="container">
      <p>追蹤最新消息：</p>
      <div class="social-links">
        <a href="#" target="_blank" rel="noopener">Threads</a>
      </div>
      <p class="copyright">&copy; 2026 多保命 RN High Pass</p>
    </div>
  </footer>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
