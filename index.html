<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="/assets/images/多保命.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/downloads.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand-group" href="/">
        <img src="/assets/images/多保命.png" alt="多保命 Logo" class="brand-logo">
        <h1 class="brand">多保命 <span class="brand-en">RN High Pass</span></h1>
      </a>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="開啟選單">
        <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <nav class="main-nav" id="main-nav" aria-label="主選單">
        <a href="/" aria-current="page">題目下載</a>
        <a href="/downloads/more.html">更多考題</a>
        <a href="/guide.html">使用教學</a>
        <a href="/feedback.html">問題回饋</a>
        <a href="/tools/nursing/index.html">臨床工具</a>
        <a href="https://exam.rnhighpass.com">模擬測驗</a>
      </nav>
    </div>
  </header>

  <!-- 主視覺 / 簡短介紹 -->
  <section class="hero">
    <div class="container">
      <p class="hero-text">
        護理國考分章題本，免費分享給學弟妹。
        希望能幫助大家更有效率地準備考試，順利上榜！
      </p>
    </div>
  </section>

  <!-- 題目下載：三個分頁的封面牆，內容由 assets/js/home.js 依 manifest 產生 -->
  <section class="section" id="download">
    <div class="container">
      <h2>題目下載</h2>
      <p>各科分章合併成一本，點封面就直接下載。</p>

      <div class="tabs" role="tablist" aria-label="題目類型" id="dl-tabs">
        <button type="button" class="tab" role="tab" id="tab-explanations" data-tab="explanations" aria-controls="panel-explanations">分章詳解</button>
        <button type="button" class="tab" role="tab" id="tab-workbooks" data-tab="workbooks" aria-controls="panel-workbooks">分章題本</button>
        <button type="button" class="tab" role="tab" id="tab-past" data-tab="past" aria-controls="panel-past">歷年考題</button>
      </div>

      <div role="tabpanel" id="panel-explanations" aria-labelledby="tab-explanations">
        <p class="dl-empty">載入中…</p>
      </div>
      <div role="tabpanel" id="panel-workbooks" aria-labelledby="tab-workbooks" hidden>
        <p class="dl-empty">載入中…</p>
      </div>
      <div role="tabpanel" id="panel-past" aria-labelledby="tab-past" hidden>
        <p class="dl-empty">載入中…</p>
      </div>

      <div class="more-cta">
        <p>只想下載單一章節，或是找更早年份的考古題？</p>
        <a class="btn-outline" href="/downloads/more.html">前往更多考題 →</a>
      </div>
    </div>
  </section>

  <!-- 線上模擬測驗(exam.rnhighpass.com，獨立網站) -->
  <section class="section" id="mock-exam">
    <div class="container">
      <h2>護理國考線上模擬測驗</h2>
      <p>
        護理師國考改為電腦化測驗，這裡可以先熟悉考試介面與流程：比照考選部的作答畫面，
        每科 60 分鐘、逐題作答、可註記與瀏覽作答情形，交卷後看分數。免登入、直接開始。
      </p>
      <a href="https://exam.rnhighpass.com" class="btn">前往線上模擬測驗</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p class="copyright">&copy; 2026 多保命 RN High Pass</p>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/home.js" defer></script>
</body>
</html>
